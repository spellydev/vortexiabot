<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">How to use a Vortexia command</title><desc id="d">Choose a command, fill in its options, and receive a response from Vortexia.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2878ff"/><stop offset="1" stop-color="#55b4ff"/></linearGradient></defs><rect width="960" height="360" rx="28" fill="#081326"/><circle cx="790" cy="55" r="100" fill="#1e5bb5" opacity=".18"/><circle cx="130" cy="330" r="120" fill="#1e5bb5" opacity=".16"/><g font-family="Arial,sans-serif"><rect x="40" y="88" width="250" height="185" rx="20" fill="#101f38" stroke="#294a78"/><rect x="355" y="88" width="250" height="185" rx="20" fill="#101f38" stroke="#294a78"/><rect x="670" y="88" width="250" height="185" rx="20" fill="#101f38" stroke="#294a78"/><g fill="#dceaff" font-size="19" font-weight="700"><text x="70" y="130">1 · Pick a command</text><text x="385" y="130">2 · Fill in options</text><text x="700" y="130">3 · Get a response</text></g><g fill="#9fb9dc" font-size="15"><text x="70" y="170">Type / or ? in Discord</text><text x="70" y="195">and select Vortexia.</text><text x="385" y="170">Choose a member, channel,</text><text x="385" y="195">duration or other fields.</text><text x="700" y="170">Vortexia runs the action</text><text x="700" y="195">and replies in the channel.</text></g><g fill="url(#g)"><rect x="70" y="220" width="125" height="28" rx="8"/><rect x="385" y="220" width="155" height="28" rx="8"/><rect x="700" y="220" width="150" height="28" rx="8"/></g><g fill="#fff" font-size="13" font-weight="700"><text x="87" y="239">/help</text><text x="402" y="239">Required fields</text><text x="717" y="239">Success / result</text></g><g stroke="#55aaff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M300 180h45m-12 -12 12 12 -12 12"/><path d="M615 180h45m-12 -12 12 12 -12 12"/></g><text x="40" y="48" fill="#8ebdff" font-size="16" font-weight="700" letter-spacing="3">VORTEXIA QUICK GUIDE</text></g></svg>